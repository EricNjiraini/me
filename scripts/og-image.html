<!doctype html>
<!--
  Source for public/og-image.png (the link preview shown on LinkedIn, Slack, X, etc.).
  Regenerate after editing (Windows, from the repo root):
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "file:///%CD%/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: hsl(222 47% 11%);
    --fg: hsl(210 40% 98%);
    --muted: hsl(215 20% 70%);
    --primary: hsl(160 84% 39%);
    --primary-glow: hsl(173 80% 40%);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; right: -160px; top: -160px; width: 640px; height: 640px;
    border-radius: 50%; background: radial-gradient(circle, hsl(160 84% 39% / 0.22), transparent 65%);
  }
  .content { position: absolute; left: 88px; top: 120px; width: 640px; }
  .rule { width: 96px; height: 6px; border-radius: 3px; background: linear-gradient(135deg, var(--primary), var(--primary-glow)); margin-bottom: 36px; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; }
  .role { font-size: 38px; font-weight: 600; margin-top: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { font-size: 28px; color: var(--muted); margin-top: 22px; }
  .domain { position: absolute; left: 88px; bottom: 64px; font-size: 24px; color: var(--muted); letter-spacing: 0.5px; }
  svg { position: absolute; right: 72px; bottom: 64px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="rule"></div>
    <h1>Eric Njiraini</h1>
    <div class="role">Data Analytics Manager</div>
    <div class="tagline">Turning data into business decisions</div>
  </div>
  <div class="domain">ericnjiraini.com</div>

  <svg width="380" height="300" viewBox="0 0 380 300" aria-hidden="true">
    <defs>
      <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="hsl(160 84% 39%)" stop-opacity="0.15" />
        <stop offset="100%" stop-color="hsl(160 84% 39%)" stop-opacity="0.55" />
      </linearGradient>
    </defs>
    <g fill="url(#bar)">
      <rect x="0"   y="200" width="40" height="100" rx="4" />
      <rect x="56"  y="170" width="40" height="130" rx="4" />
      <rect x="112" y="185" width="40" height="115" rx="4" />
      <rect x="168" y="130" width="40" height="170" rx="4" />
      <rect x="224" y="105" width="40" height="195" rx="4" />
      <rect x="280" y="70"  width="40" height="230" rx="4" />
      <rect x="336" y="40"  width="40" height="260" rx="4" />
    </g>
    <polyline points="20,160 76,132 132,146 188,92 244,70 300,38 356,12"
      fill="none" stroke="hsl(173 80% 40%)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="356" cy="12" r="9" fill="hsl(173 80% 40%)" />
  </svg>
</body>
</html>
