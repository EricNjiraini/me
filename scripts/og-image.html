<!doctype html>
<!--
  Source for public/og-image.png (the link preview shown on LinkedIn, Slack, X, etc.).
  Regenerate after editing (Windows, from the repo root):
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "file:///%CD%/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css" />
<style>
  :root {
    --bg: hsl(222 47% 11%);
    --fg: hsl(210 40% 98%);
    --muted: hsl(215 20% 70%);
    --primary: hsl(160 84% 39%);
    --primary-glow: hsl(173 80% 40%);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter Variable", "Segoe UI", system-ui, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; right: -160px; top: -160px; width: 640px; height: 640px;
    border-radius: 50%; background: radial-gradient(circle, hsl(160 84% 39% / 0.22), transparent 65%);
  }
  .content { position: absolute; left: 88px; top: 112px; width: 640px; }
  .rule { width: 96px; height: 6px; border-radius: 3px; background: linear-gradient(135deg, var(--primary), var(--primary-glow)); margin-bottom: 36px; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -1.5px; line-height: 1.05; }
  .role { font-size: 38px; font-weight: 600; margin-top: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { font-size: 28px; color: var(--muted); margin-top: 22px; }
  .focus { font-size: 24px; font-weight: 500; color: var(--primary-glow); margin-top: 26px; letter-spacing: 0.2px; }
  .domain { position: absolute; left: 88px; bottom: 64px; font-size: 24px; color: var(--muted); letter-spacing: 0.5px; }
  .photo {
    position: absolute; right: 96px; top: 135px; width: 360px; height: 360px; border-radius: 50%;
    padding: 8px; background: linear-gradient(135deg, var(--primary), var(--primary-glow));
    box-shadow: 0 0 80px hsl(160 84% 39% / 0.35);
  }
  .photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="rule"></div>
    <h1>Eric Njiraini</h1>
    <div class="role">Data Analytics Manager</div>
    <div class="tagline">Turning data into business decisions</div>
    <div class="focus">Data &amp; AI Strategy · MLOps · AWS · Analytics</div>
  </div>
  <div class="domain">ericnjiraini.com</div>
  <div class="photo"><img src="../public/eric-njiraini.webp" alt="" /></div>
</body>
</html>
